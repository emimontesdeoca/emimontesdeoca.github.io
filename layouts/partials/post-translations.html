{{ $translations := .Translations }}
{{ if $translations }}
<div class="flex items-center gap-2 text-sm text-gh-text-secondary mb-8">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
  </svg>
  <span>Available in:</span>
  <span class="font-medium text-gh-accent">
    {{ .Language.LanguageName }}
  </span>
  {{ range $translations }}
    <span class="text-gh-text-tertiary">·</span>
    <a href="{{ .RelPermalink }}" class="font-medium text-gh-accent hover:text-gh-accent-hover transition-colors"
      data-umami-event="post-translation-click" data-umami-event-lang="{{ .Language.Lang }}">
      {{ .Language.LanguageName }}
    </a>
  {{ end }}
</div>
{{ end }}
