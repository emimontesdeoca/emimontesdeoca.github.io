{{ define "main" }}
<div class="py-4">
  <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-8">{{ .Title }}</h1>

  <div class="space-y-1">
    {{ range .Pages.ByDate.Reverse }}
    <a href="{{ .RelPermalink }}" class="group block py-3 -mx-3 px-3 rounded-lg hover:bg-gh-bg-secondary transition-colors" data-umami-event="list-post-click" data-umami-event-title="{{ .Title }}">
      <div class="flex items-baseline justify-between gap-4">
        <h2 class="text-base font-medium text-gh-text group-hover:text-gh-accent transition-colors truncate">
          {{ .Title }}
        </h2>
        <time class="text-sm text-gh-text-tertiary whitespace-nowrap flex-shrink-0" datetime="{{ .Date.Format "2006-01-02" }}">
          {{ .Date.Format "Jan 2, 2006" }}
        </time>
      </div>
      {{ with .Description }}
      <p class="text-sm text-gh-text-secondary mt-1 line-clamp-2">{{ . }}</p>
      {{ end }}
      {{ with .Params.tags }}
      <div class="flex flex-wrap gap-1.5 mt-2">
        {{ range first 3 . }}
        <span class="inline-block px-2 py-0.5 text-xs rounded-full bg-gh-bg-secondary text-gh-text-tertiary border border-gh-border">
          {{ . }}
        </span>
        {{ end }}
      </div>
      {{ end }}
    </a>
    {{ end }}
  </div>

  {{ template "_internal/pagination.html" . }}
</div>
{{ end }}
