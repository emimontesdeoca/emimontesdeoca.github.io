baseURL = "https://emimontesdeoca.github.io/"
languageCode = "en"
title = "Emiliano Montesdeoca"
theme = ""
paginate = 10
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Microsoft MVP in Developer Technologies. Cloud Solutions Team Lead. Speaker, blogger, and community advocate."
  author = "Emiliano Montesdeoca"
  github = "https://github.com/emimontesdeoca"
  twitter = "https://twitter.com/emimontesdeocaa"
  linkedin = "https://www.linkedin.com/in/emimontesdeoca/"
  instagram = "https://www.instagram.com/emimontesdeoca/"
  sessionize = "https://sessionize.com/emimontesdeoca/"
  email = "emimontesdeoca@outlook.es"
  blog = "https://thedotnetblog.com"

  # Umami Analytics
  [params.umami]
    enabled = true
    websiteId = "0834ea36-1ac0-457f-9953-04b28fe8df8f"
    scriptURL = "https://analytics.emilianomontesdeoca.com/script.js"

[markup]
